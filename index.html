<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Design und Sprache schon vor dem ersten Zeichnen setzen – sonst blitzt kurz das helle Design auf. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          var lang = localStorage.getItem("language");
          if (lang === "de" || lang === "en") document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
    <title>Daniel Keller | Portfolio</title>
    <meta
      name="description"
      content="Portfolio von Daniel Keller – Software Developer mit Fokus auf TypeScript, Python und modernen Webtechnologien."
    />
    <meta
      name="keywords"
      content="Daniel Keller, Software Developer, React, TypeScript, Portfolio"
    />
    <meta name="author" content="Daniel Keller" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Keller – Softwareentwickler" />
    <meta
      property="og:description"
      content="Portfolio von Daniel Keller – moderne Webentwicklung mit React, TypeScript und Python."
    />
    <meta property="og:url" content="https://daniel-keller.dev/" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://daniel-keller.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daniel Keller – Softwareentwickler" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://daniel-keller.dev/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
